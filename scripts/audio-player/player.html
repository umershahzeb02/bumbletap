<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Playlist</title>
<style>
/* System fonts only. A web-font @import here once held the whole script back
   past the page's handshake window and dropped the track being sent. */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0E0F13;--surface:#17191F;--raised:#1F222A;--line:#2A2E38;--ink:#EEF0F4;--muted:#A3AABA;--faint:#6E7586;
  --danger:#E5484D;--danger-ink:#FF9EA1;
  --accent:#F07A2B;--on-accent:#fff;
  --soft:color-mix(in oklab,var(--accent) 16%,transparent);
  --accent-ink:color-mix(in oklab,var(--accent) 82%,#fff);
  --ring:color-mix(in oklab,var(--accent) 55%,var(--ink));
  --hover:color-mix(in oklab,var(--ink) 7%,transparent);
  --shadow:0 14px 36px -10px rgba(0,0,0,.7),0 0 0 1px var(--line);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t:150ms ease-out;
}
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#FFFFFF;--surface:#F6F7FA;--raised:#FFFFFF;--line:#E4E7EE;--ink:#0C1222;--muted:#5A6378;--faint:#8A92A6;
  --danger-ink:#B42328;
  --accent-ink:color-mix(in oklab,var(--accent) 70%,#000);
  --shadow:0 14px 36px -12px rgba(12,18,34,.25),0 0 0 1px var(--line);
}}
html,body{height:100%}
body{font:14px/1.4 var(--sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;min-width:300px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
svg{display:block;flex-shrink:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* icon buttons: 40px targets, 10px radius */
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;transition:background var(--t),color var(--t),transform var(--t)}
.ib:not(:disabled):hover{background:var(--hover);color:var(--ink)}
.ib:not(:disabled):active{transform:scale(.94)}
.ib.on{color:var(--accent-ink)}
.ib.on::after{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.ib .badge{position:absolute;top:8px;right:7px;font:700 8.5px/1 var(--mono)}

/* ---------- header ---------- */
.top{height:44px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 4px 0 14px}
.mark{color:var(--accent);display:flex;transition:color var(--t)}
.brand{flex:1;font-size:14px;font-weight:650;letter-spacing:-.005em}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 4px);right:2px;min-width:200px;padding:6px;border-radius:12px;background:var(--raised);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px;font-size:13px;text-align:left;color:var(--ink);transition:background var(--t)}
.mi svg{color:var(--muted)}
.mi:not(:disabled):hover,.mi:focus-visible{background:var(--hover);outline:none}
.mi.danger{color:var(--danger-ink)}.mi.danger svg{color:currentColor}
.msep{height:1px;background:var(--line);margin:5px 4px}

/* ---------- now playing ---------- */
.now{height:88px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:4px 16px 8px}
.now-meta{flex:1;min-width:0}
.now-title{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.now-src{margin-top:3px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-src a{color:inherit;text-decoration:none;border-radius:4px}
.now-src a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.hero{display:none;align-items:center;gap:14px;flex:1;min-width:0}
.hero p{font-size:14px;line-height:1.4;font-weight:500;text-wrap:pretty}
body.is-empty .hero{display:flex}
body.is-empty .now-art,body.is-empty .now-meta{display:none}
.keycap{width:64px;height:64px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;padding-bottom:4px;
  font:700 24px/1 var(--mono);color:var(--ink);
  background:linear-gradient(180deg,var(--raised),var(--surface));
  box-shadow:inset 0 -5px 0 var(--line),inset 0 0 0 1px var(--line),0 8px 18px -10px rgba(0,0,0,.55)}

/* generated artwork: the track's tone, a pattern from its URL hash, its initial */
.art{position:relative;display:grid;place-items:center;flex-shrink:0;overflow:hidden;color:#fff;
  background:linear-gradient(135deg,var(--tone),color-mix(in oklab,var(--tone) 58%,#000))}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art b{position:relative;color:rgba(255,255,255,.7);font-weight:700;line-height:1}
.art-64{width:64px;height:64px;border-radius:12px;box-shadow:0 8px 20px -10px color-mix(in oklab,var(--tone) 70%,transparent)}
.art-64 b{font-size:28px}
.art-28{width:28px;height:28px;border-radius:7px}
.art-28 b{font-size:12.5px}
.art-idle{--tone:var(--raised);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- seek ---------- */
.seekrow{height:30px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px}
.time{font:500 11.5px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);min-width:36px}
#td{text-align:right}
.seek,.vol{position:relative;flex:1;display:flex;align-items:center;cursor:pointer;touch-action:none;border-radius:6px}
.seek{height:18px}
.seek.off{cursor:default}
.rail{position:relative;width:100%;border-radius:999px;background:var(--line)}
.seek .rail{height:6px}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:var(--accent)}
.thumb{position:absolute;top:50%;left:0;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity var(--t),transform var(--t)}
.seek .thumb{width:14px;height:14px;background:var(--accent);box-shadow:0 0 0 3px var(--bg)}
.seek:not(.off):hover .thumb,.seek:focus-visible .thumb,.seek.drag .thumb,
.vol:hover .thumb,.vol:focus-visible .thumb,.vol.drag .thumb{opacity:1;transform:translate(-50%,-50%)}

/* ---------- transport ---------- */
.ctrls{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.pp{width:52px;height:52px;border-radius:999px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);
  box-shadow:0 10px 22px -10px color-mix(in oklab,var(--accent) 80%,transparent);transition:transform var(--t),filter var(--t),background var(--t)}
.pp:not(:disabled):hover{filter:brightness(1.07)}
.pp:disabled{opacity:1;background:var(--raised);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.pp:not(:disabled):active{transform:scale(.95)}
.skip text{font:700 7.5px var(--sans);fill:currentColor;stroke:none}

/* ---------- volume + speed ---------- */
.extras{height:44px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 14px 4px 8px}
.vol{height:24px}
.vol .rail{height:4px}
.vol .fill{background:var(--muted);transition:background var(--t)}
.vol:hover .fill,.vol.drag .fill{background:var(--ink)}
.vol.muted .fill{opacity:.35}
.vol .thumb{width:12px;height:12px;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.vol-label{font:500 11.5px/1 var(--mono);color:var(--muted);min-width:26px;text-align:right;margin-right:6px}
.chip{position:relative;height:28px;min-width:48px;padding:0 10px;border-radius:999px;font:600 12px/1 var(--mono);color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--t),box-shadow var(--t)}
.chip::before{content:'';position:absolute;inset:-6px -2px}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 45%,transparent)}

/* ---------- error banner ---------- */
.banner{display:none;flex-shrink:0;gap:10px;align-items:flex-start;margin:0 12px 8px;padding:8px 2px 8px 12px;border-radius:12px;
  background:color-mix(in oklab,var(--danger) 12%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--danger) 32%,transparent)}
.banner.show{display:flex;animation:rise 150ms ease-out}
.banner-ico{color:var(--danger);margin-top:1px}
.banner-body{flex:1;min-width:0}
.banner p{font-size:12.5px;line-height:1.42;user-select:text;overflow-wrap:anywhere}
.banner-acts{display:flex;gap:6px;margin-top:6px}
.banner-acts:empty{display:none}
.banner .ib{width:32px;height:32px;margin-top:-5px;border-radius:8px}
.btn-s{height:28px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--t)}
.btn-s:hover{background:var(--hover)}
.banner.busy .banner-ico{color:var(--muted)}

/* ---------- queue ---------- */
.queue{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-radius:16px 16px 0 0}
.qhead{height:44px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 6px 0 16px}
.qtitle{flex:1;font-size:13px;font-weight:600}
.qtitle .n{color:var(--muted);font:500 12px var(--mono);margin-left:2px}
.qfilter{flex:1;display:none}
.qhead.filtering .qtitle{display:none}
.qhead.filtering .qfilter{display:block}
.field{width:100%;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:13px var(--sans);padding:0 12px;outline:none;user-select:text;transition:border-color var(--t),box-shadow var(--t)}
.field::placeholder{color:var(--muted)}
.field:focus{border-color:var(--ring);box-shadow:0 0 0 3px var(--soft)}
.qfilter .field{height:32px;margin-left:-6px}
.addrow{flex-shrink:0;display:flex;gap:8px;padding:0 12px 10px}
.btn{height:40px;padding:0 16px;flex-shrink:0;border-radius:10px;font-size:13px;font-weight:600;background:var(--accent);color:var(--on-accent);transition:filter var(--t),background var(--t),color var(--t)}
.btn:not(:disabled):hover{filter:brightness(1.07)}
.btn:disabled{opacity:1;background:var(--raised);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.q{flex:1;min-height:0;overflow-y:auto;padding:0 6px 10px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.qempty{padding:22px 16px;text-align:center;font-size:12.5px;color:var(--muted)}

.qi{display:flex;align-items:center;gap:4px;height:48px;padding:0 4px 0 6px;border-radius:10px;position:relative;transition:background var(--t)}
.qi:hover{background:var(--hover)}
.qi.on{background:var(--soft)}
.qi-main{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:10px;padding-left:4px;border-radius:8px;cursor:pointer}
.qi-text{flex:1;min-width:0}
.qi-title{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi.on .qi-title{font-weight:650}
.qi-sub{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.qi-sub .d{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:10.5px;font-weight:650;line-height:16px;padding:0 6px;border-radius:999px;color:var(--danger-ink);background:color-mix(in oklab,var(--danger) 15%,transparent);vertical-align:1px;margin-right:4px}
.qi.dead .art{filter:grayscale(.9);opacity:.55}
.qi.dead .qi-title{color:var(--muted)}
.qi-acts{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity var(--t)}
.qi:hover .qi-acts,.qi:focus-within .qi-acts{opacity:1}
.qi-acts .ib{width:36px;height:40px}
.qi-acts .ib.busy{opacity:.45;pointer-events:none}
.qi-acts .rm:hover{color:var(--danger-ink);background:color-mix(in oklab,var(--danger) 12%,transparent)}
.retry{height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:600;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.retry:hover{background:var(--hover)}
.qi.dragging{opacity:.4}
.qi.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.eq{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:7px;background:rgba(0,0,0,.25)}
.eq i{width:3px;height:13px;border-radius:1px;background:#fff;transform-origin:bottom;transform:scaleY(.45);animation:eq .9s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
body.is-playing .qi.on .eq i{animation-play-state:running}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.qi.on .art b{visibility:hidden}

/* ---------- toast ---------- */
.toasts{position:fixed;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;pointer-events:none;z-index:70}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:100%;min-height:40px;padding:6px 6px 6px 14px;border-radius:10px;background:var(--raised);font-size:12.5px;box-shadow:var(--shadow);animation:rise 150ms ease-out}
.toast:not(:has(button)){padding-right:14px}
.toast button{height:28px;padding:0 10px;border-radius:8px;font-weight:650;color:var(--accent-ink)}
.toast button:hover{background:var(--hover)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- send to phone ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;padding:0 20px 18px;overflow-y:auto}
.sheet.show{display:flex;animation:fade 150ms ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-top{align-self:stretch;height:44px;flex-shrink:0;display:flex;align-items:center;gap:8px;margin:0 -16px 0 -6px}
.sheet-title{flex:1;font-size:14px;font-weight:650}
.sheet-sub{font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center;max-width:310px;margin:0 0 14px;text-wrap:balance}
.qr{background:#fff;border-radius:14px;padding:8px;line-height:0;box-shadow:0 0 0 1px var(--line),0 14px 30px -16px rgba(0,0,0,.6);min-width:140px;min-height:140px;display:grid;place-items:center}
.qr canvas{display:block;image-rendering:pixelated}
.qr-msg{line-height:1.5;padding:28px 18px;font-size:12.5px;color:#4A5160;text-align:center;max-width:220px}
.sheet-nav{display:none;align-items:center;gap:4px;margin-top:12px}
.sheet-nav.show{display:flex}
.navlbl{font:600 12.5px/1 var(--mono);min-width:92px;text-align:center}
.cyc{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;margin-left:6px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--t)}
.cyc:hover{background:var(--hover)}
.cyc.on{background:var(--soft);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent) 45%,transparent)}
.sheet-meta{margin-top:10px;font-size:12px;color:var(--muted);text-align:center;max-width:310px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-copy{margin-top:12px;height:36px;padding:0 14px;border-radius:10px;font-size:12.5px;font-weight:600;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--t)}
.sheet-copy:hover{background:var(--hover)}
.sheet-warn{margin-top:10px;font-size:12px;line-height:1.45;color:var(--danger-ink);text-align:center;max-width:300px}

/* a window that lost the singleton election only forwards, then closes */
.relay{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:var(--bg);color:var(--muted);font-size:13px}
body.relaying .relay{display:grid}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head><body>

<header class="top">
  <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
  <h1 class="brand">Playlist</h1>
  <button class="ib" id="qphone" aria-label="Send to phone" title="Send to phone"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></button>
  <div class="menuwrap">
    <button class="ib" id="menubtn" aria-label="More actions" title="More actions" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
    <div class="menu" id="menu" role="menu" aria-label="Queue actions" hidden>
      <button class="mi" role="menuitem" id="qexjson"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Export JSON</button>
      <button class="mi" role="menuitem" id="qexm3u"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>Export M3U</button>
      <button class="mi" role="menuitem" id="qcopy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy links</button>
      <button class="mi" role="menuitem" id="qimport"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>Import…</button>
      <div class="msep" role="separator"></div>
      <button class="mi danger" role="menuitem" id="qclr"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Clear queue</button>
    </div>
  </div>
</header>

<section class="now" aria-label="Now playing">
  <div class="now-art" id="nart"></div>
  <div class="now-meta">
    <div class="now-title" id="nt"></div>
    <div class="now-src" id="ns"></div>
  </div>
  <div class="hero" id="hero"><span class="keycap" aria-hidden="true">V</span><p>Press V on any page with audio to add it to your playlist.</p></div>
</section>

<div class="seekrow">
  <span class="time" id="tc">0:00</span>
  <div class="seek off" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
    <div class="rail"><div class="fill" id="sf"></div></div><div class="thumb" id="sthumb"></div>
  </div>
  <span class="time" id="td">--:--</span>
</div>

<div class="ctrls">
  <button class="ib" id="shuf" aria-label="Shuffle" title="Shuffle" aria-pressed="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg></button>
  <button class="ib skip" id="back" aria-label="Back 15 seconds" title="Back 15 seconds"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 3.8v4.6h4.6"/><text x="12.6" y="15.3" text-anchor="middle">15</text></svg></button>

<script>
/* ===== RECLAIM OUR OWN NAME =====
   The page opens us with window.open('', '__afp_player'), which names the blank

const $ = id => document.getElementById(id);
const clamp01 = v => Math.max(0, Math.min(1, v));

/* ===== STATE ===== */
const queue = []; let idx = -1, audio = null, playing = false, shuffling = false, repeatMode = 0;   // repeat: 0 off, 1 all, 2 one
const SPEEDS = [.5, .75, 1, 1.25, 1.5, 2]; let rate = 1;

// Playback preferences survive a track change and a reload.

const fmt = s => {

/* ===== ICONS (inline stroke SVG, currentColor) ===== */
const svg = (w, body, extra) => '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '>' + body + '</svg>';
const ICONS = {
  play: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 5.6v12.8a1 1 0 0 0 1.53.85l10.2-6.4a1 1 0 0 0 0-1.7l-10.2-6.4A1 1 0 0 0 8.5 5.6z"/></svg>',
  pause: '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  note: svg(26, '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
  vol: svg(20, '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>'),
  volLow: svg(20, '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>'),
  volOff: svg(20, '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>'),
  filter: svg(18, '<path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/>'),
  x: svg(16, '<path d="M18 6 6 18M6 6l12 12"/>', ' stroke-width="2"'),
  dl: svg(17, '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>'),
  cycle: svg(14, '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>', ' stroke-width="2.2"'),
  pauseS: '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
};

/* ===== TRACK TONE + GENERATED ARTWORK =====

   picked by a stable hash of its URL, plus a faint pattern from the same hash
   and its initial. The current track's tone becomes the accent. */
const TONES = ['#F07A2B', '#E5484D', '#2FA86A', '#3D7BF0', '#8B5CF6', '#E64C9A', '#E8B425'];

const SERIES_PREFIX = /^\s*(?:(?:ep(?:isode)?|e|ch(?:apter)?|part|pt|lecture|lesson|track|no|vol(?:ume)?|session|season|s)\.?\s*#?\d+[a-z]?|#\d+)\s*[:.\-–—|)]*\s*/i;

// Canvas twin for Media Session, which needs image URLs.
const artCache = new Map();
function artDataURL(t, size) {
  const key = t.url + '\n' + t.title + '\n' + size;
  if (artCache.has(key)) return artCache.get(key);

    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d'), h = hashStr(t.url), tone = TONES[h % TONES.length];
    const n = parseInt(tone.slice(1), 16), dk = v => Math.round(v * .58);

    g.addColorStop(0, tone); g.addColorStop(1, 'rgb(' + dk(n >> 16) + ',' + dk((n >> 8) & 255) + ',' + dk(n & 255) + ')');

    x.restore();
    x.fillStyle = 'rgba(255,255,255,.7)'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '700 ' + Math.round(size * .44) + 'px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

}

/* ===== CROSS-ORIGIN TRANSPORT =====
   The player is hosted on a fixed origin while the host page can be any site,
   so page->player traffic goes over postMessage. Every message carries __afp:1.
   Inbound origin is deliberately not restricted (any site may send), so the
   payload shape is validated strictly instead. */
const deriveTitle = u => { try { return decodeURIComponent(u.split('/').pop().split('?')[0]).slice(0, 60) || 'Untitled'; } catch (_) { return 'Untitled'; } };
const isHttpUrl = s => typeof s === 'string' && s.length < 4096 && /^https?:\/\/\S+$/i.test(s);
const validTrack = d => d && isHttpUrl(d.url)
  && (d.title === undefined || d.title === null || typeof d.title === 'string')
  && (d.site === undefined || d.site === null || (typeof d.site === 'string' && d.site.length < 200))
  && (d.page === undefined || d.page === null || typeof d.page === 'string');
const okDur = v => (typeof v === 'number' && isFinite(v) && v > 0) || v === null ? v : undefined;

// the "from site" link and the banner's Open page.
const normTrack = d => ({ url: d.url, title: (typeof d.title === 'string' && d.title.trim()) ? d.title.trim().slice(0, 300) : deriveTitle(d.url),
  site: (typeof d.site === 'string' && d.site) || null, page: isHttpUrl(d.page) ? d.page : null, dur: okDur(d.dur) });

// Where the track came from: the page it was found on, else the file's own host.
function siteOf(t) {
  if (t && t.site) return t.site;
  try { return new URL(t.url).hostname.replace(/^www\./, ''); } catch (_) { return ''; }
}

function reply(e, msg) {
  try {
    if (!e || !e.source) return;

window.addEventListener('message', e => {
  const d = e.data;

  if (d.type === 'ping') { reply(e, { type: 'pong' }); return; }
  if (d.type === 'add') { if (validTrack(d)) whenElected(() => incoming([d], e, d)); return; }
  if (d.type === 'addMany' && Array.isArray(d.tracks)) { whenElected(() => incoming(d.tracks, e, d)); return; }

  if (d.type === 'retitle') {

    const t = queue.find(x => x.url === d.url);
    if (t && t.title !== d.title.trim()) {
      t.title = d.title.trim().slice(0, 300); renderQ();
      if (idx >= 0 && queue[idx] === t) { paintNow(); updateMediaSession(); }

/* An add from a page is someone clicking a track. The reply says what really
   happened, so the page can tell "Added" from "Already in the queue":
   {type:'added', count, requested, added: [new urls], dup: [urls already queued],
   id (echoed when the message had one)}. When the player is idle, the first
   requested track starts, whether new or already queued; send play:false to

   replies with the incumbent's answer. */

    relay(valid, play).then(r => send(r && Array.isArray(r.added) && Array.isArray(r.dup) ? r : { added: valid.map(t => t.url), dup: [] }));

function mergeTracks(valid, play) {
  const added = [], dup = [];

  // new here while it's already saved; check the store so the reply is true.
  let stored = null;
  if (!loaded) { try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); stored = new Set((s && Array.isArray(s.queue) ? s.queue : []).map(t => t && t.url)); } catch (_) {} }

// Tell the opener we're live so it can flush anything it buffered while we loaded.
(function announceReady() {
  try { if (window.opener && !window.opener.closed) window.opener.postMessage({ __afp: 1, type: 'ready' }, '*'); } catch (_) {}
})();

/* ===== SHARED QUEUE ACROSS SITES =====
   Every player window lives on this one origin regardless of which site opened
   it, so localStorage and BroadcastChannel are shared between them all.

   A 'state' message replaces the receiver's queue wholesale, so broadcasting one
   is a claim to be authoritative. It is false before `loaded` (we haven't read
   the stored queue yet) and after `standingDown` (we lost the election and are

const STORE = '__afp_queue_v1', NOW_KEY = '__afp_now_v1';

/* ===== EXTENSION-OWNED QUEUE =====

  if (d.type === 'ext-player-state') extAlive = true;

});

    try { window.postMessage(Object.assign({ __afp: 1, type, id }, payload || {}), '*'); } catch (_) {}
    setTimeout(() => { if (extWaiting[id]) { delete extWaiting[id]; resolve(null); } }, 700);

// Replace the queue from an authoritative source without echoing it back,
// keeping playback anchored by URL and this window's own observations.
function replaceQueue(list) {

    queue.length = 0;

/* Save one track. A direct fetch keeps the title as the file name; a host that

async function downloadTrack(i, btn) {
  const t = queue[i]; if (!t) return;
  const ext = (t.url.split(/[?#]/)[0].split('.').pop() || 'mp3').slice(0, 4);
  const safe = (t.title || 'audio').replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim().slice(0, 80);
  const name = /\.[a-z0-9]{2,4}$/i.test(safe) ? safe : safe + '.' + ext;

    const res = await fetch(t.url, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const href = URL.createObjectURL(await res.blob());
    const a = document.createElement('a'); a.href = href; a.download = name;

    setTimeout(() => URL.revokeObjectURL(href), 10000);

// Crisp modules: a whole number of device pixels each, sized to the window.
function drawQR(text) {

  if (!q) { box.innerHTML = '<p class="qr-msg">This link is too long for a code. Use Copy link instead.</p>'; return false; }
  const quiet = 3, total = q.n + quiet * 2;
  const avail = Math.max(170, Math.min(innerWidth - 60, innerHeight - 300, 380));
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const px = Math.max(2, Math.floor(avail * dpr / total));
  const cv = document.createElement('canvas');
  cv.width = cv.height = total * px;
  cv.style.width = cv.style.height = (total * px / dpr) + 'px';
  cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'QR code for your phone');
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.fillStyle = '#000';
  for (let i = 0; i < q.n; i++) for (let j = 0; j < q.n; j++) if (q.m[i][j]) cx.fillRect((j + quiet) * px, (i + quiet) * px, px, px);
  box.appendChild(cv);

}

/* ===== SEND TO PHONE =====
   Format v2 (mobile-player.html decodes both):
     #v=2&d=<base64url(deflate-raw(UTF-8 JSON))>  [&s=<sid>&c=<k>&n=<N> when split]
     JSON {b: common URL prefix, t: [[title, url suffix, site or ''], …],
           i: current index in this part or -1, p: position of the current track (whole seconds) or 0}
   The whole queue goes, in order, including tracks before the current one.
   Format v1 (#q=<base64url(JSON {b, t:[[title, suffix]]})>) is the fallback for a
   browser without CompressionStream('deflate-raw'); it can't carry the current
   track, so like before it starts from the current track. */
const RECEIVER = 'https://umershahzeb02.github.io/bumbletap/scripts/audio-player/mobile-player.html';

// bigger goes out over Copy link instead.
const QR_MAX = 760, HDR_RESERVE = 20, CYCLE_MS = 900;

let sheetLink = '', xfer = null, cycleT = null, sheetGen = 0, sheetResized = null, sheetReturn = null;

function commonPrefix(urls) {
  let pre = urls.length ? urls[0] : '';
  for (let i = 1; i < urls.length && pre; i++) { let j = 0; while (j < pre.length && j < urls[i].length && pre[j] === urls[i][j]) j++; pre = pre.slice(0, j); }
  return pre;
}
function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlBytes(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function deflateRaw(text) {

  return new Uint8Array(await new Response(stream).arrayBuffer());
}
const xferSid = () => Math.random().toString(36).slice(2, 6);
const header = (sid, c, n) => n > 1 ? '&s=' + sid + '&c=' + c + '&n=' + n : '';

// v1
function buildLinkV1(list, sid, c, n) {
  const pre = commonPrefix(list.map(t => t.url));
  return RECEIVER + '#q=' + b64url(JSON.stringify({ b: pre, t: list.map(t => [t.title || '', t.url.slice(pre.length)]) })) + header(sid, c, n);
}
// Greedy packing; a track whose own link is over the limit rides Copy link only.
function chunkQueueV1(all) {
  const cap = QR_MAX - HDR_RESERVE, chunks = [], oversize = []; let cur = [];
  for (const t of all) {
    if (buildLinkV1([t], null, 1, 1).length > cap) { oversize.push(t); continue; }
    const trial = cur.concat([t]);
    if (cur.length && buildLinkV1(trial, null, 1, 1).length > cap) { chunks.push(cur); cur = [t]; } else cur = trial;
  }
  if (cur.length) chunks.push(cur);
  return { chunks, oversize };
}

// v2
function payloadV2(list, cur, pos) {
  const pre = commonPrefix(list.map(t => t.url));
  return { b: pre, t: list.map(t => [t.title || '', t.url.slice(pre.length), t.site || '']), i: cur, p: cur >= 0 ? Math.max(0, Math.floor(pos || 0)) : 0 };
}
async function buildLinkV2(list, cur, pos, sid, c, n) {
  return RECEIVER + '#v=2&d=' + b64urlBytes(await deflateRaw(JSON.stringify(payloadV2(list, cur, pos)))) + header(sid, c, n);
}
/* Contiguous parts, each as long as fits. Compressed size grows with the run,
   so gallop to bracket the longest run that fits and binary-search inside it:
   about a dozen compressions per code instead of one per track. */
async function chunkQueueV2(all, cur, pos) {
  const cap = QR_MAX - HDR_RESERVE, n = all.length, parts = [], oversize = [];
  const fits = async (a, b) => {
    const ci = cur >= a && cur < b ? cur - a : -1;
    return (await buildLinkV2(all.slice(a, b), ci, ci >= 0 ? pos : 0, null, 1, 1)).length <= cap;
  };
  let s = 0;
  while (s < n) {
    if (!(await fits(s, s + 1))) { oversize.push(all[s]); s++; continue; }
    let lo = 1, hi = 0, size = 2;
    while (size <= n - s) { if (await fits(s, s + size)) { lo = size; size *= 2; } else { hi = size; break; } }
    if (!hi) { if (lo < n - s && await fits(s, n)) lo = n - s; hi = lo === n - s ? lo + 1 : n - s; }
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (await fits(s, s + mid)) lo = mid; else hi = mid; }

    s += lo;
  }

}
async function handoffV2(all, cur, pos) {
  const split = await chunkQueueV2(all, cur, pos), sid = xferSid(), n = split.parts.length, parts = [];
  for (let k = 0; k < n; k++) {
    const p = split.parts[k], list = all.slice(p.start, p.end), ci = cur >= p.start && cur < p.end ? cur - p.start : -1;
    parts.push({ tracks: list, link: await buildLinkV2(list, ci, ci >= 0 ? pos : 0, sid, k + 1, n) });
  }
  return { v: 2, parts, oversize: split.oversize, copy: await buildLinkV2(all, cur, pos, null, 1, 1) };
}
function handoffV1(all, cur) {
  const list = all.slice(cur > 0 ? cur : 0), split = chunkQueueV1(list), sid = xferSid(), n = split.chunks.length;
  return { v: 1, parts: split.chunks.map((ch, k) => ({ tracks: ch, link: buildLinkV1(ch, sid, k + 1, n) })), oversize: split.oversize, copy: buildLinkV1(list, null, 1, 1) };
}
async function buildHandoff(all, cur, pos) {
  if (CAN_DEFLATE) { try { return await handoffV2(all, cur, pos); } catch (_) {} }
  return handoffV1(all, cur);
}

/* Several codes rotate on their own once started, wrapping forever, so the
   phone's scanner can sit and collect the set. They start paused, so the
   first code stays put long enough to scan. Prev/Next step by hand. */
function stopCycle() { if (cycleT) { clearInterval(cycleT); cycleT = null; } paintCycle(); }
function startCycle() {
  if (!xfer || xfer.links.length < 2) return;
  stopCycle();
  cycleT = setInterval(() => { if (!xfer) { stopCycle(); return; } xfer.i = (xfer.i + 1) % xfer.links.length; renderXferFrame(); }, CYCLE_MS);
  paintCycle();
}
function paintCycle() {
  const b = $('sheetauto');
  b.innerHTML = (cycleT ? ICONS.pauseS : ICONS.cycle) + '<span>' + (cycleT ? 'Pause' : 'Cycle') + '</span>';
  b.classList.toggle('on', !!cycleT);
  b.setAttribute('aria-pressed', String(!!cycleT));
  b.setAttribute('aria-label', cycleT ? 'Pause cycling through the codes' : 'Cycle through the codes automatically');
  b.title = cycleT ? 'Pause' : 'Cycle through the codes';
}
function renderXferFrame() {
  if (!xfer) return;
  drawQR(xfer.links[xfer.i]);
  $('sheetnavlbl').textContent = 'Code ' + (xfer.i + 1) + ' of ' + xfer.links.length;
}
function sheetFocusables() { return [...$('sheet').querySelectorAll('button:not(:disabled):not([hidden])')].filter(b => b.offsetParent !== null); }

async function openSheet() {
  if (!queue.length) { qToast('Add a track first, then send the queue to your phone'); return; }
  closeMenu();
  const gen = ++sheetGen;
  sheetReturn = document.activeElement;
  const sheet = $('sheet');
  sheet.classList.add('show');
  $('sheetnav').classList.remove('show'); $('sheetwarn').hidden = true; $('sheetcopy').hidden = false;
  $('qrbox').innerHTML = '<p class="qr-msg">Making the code…</p>';
  $('sheetsub').textContent = 'Point your phone’s camera at the code.';
  $('sheetmode').textContent = '';
  $('sheetx').focus();
  // A popup this small draws modules too fine to scan; grow it while the sheet is up.
  try { if (outerWidth < 440 || outerHeight < 700) { sheetResized = [outerWidth, outerHeight]; resizeTo(Math.max(outerWidth, 460), Math.max(outerHeight, 720)); } } catch (_) {}

  const all = queue.map(t => ({ url: t.url, title: t.title, site: t.site || '' }));
  const cur = idx, curT = idx >= 0 ? queue[idx] : null;
  const pos = audio && audio.getAttribute('src') && isFinite(audio.currentTime) ? Math.floor(audio.currentTime) : 0;
  const h = await buildHandoff(all, cur, pos);
  if (gen !== sheetGen || !sheet.classList.contains('show')) return;

  sheetLink = h.copy;
  stopCycle();
  const sent = h.v === 2 ? all.length : all.length - Math.max(0, cur);
  $('sheetmode').textContent = nTracks(sent) + (curT ? ' · starts at ‘' + shortTitle(curT.title) + '’' + (h.v === 2 && pos ? ', ' + fmt(pos) : '') : '');
  if (!h.parts.length) {
    xfer = null;
    $('qrbox').innerHTML = '<p class="qr-msg">These links are too long for a scannable code.</p>';
    $('sheetsub').textContent = 'Copy the link, send it to yourself, and open it on your phone.';
    return;
  }
  xfer = { chunks: h.parts.map(p => p.tracks), links: h.parts.map(p => p.link), i: 0, v: h.v };
  const n = xfer.links.length;
  if (n > 1) {
    $('sheetsub').textContent = 'Your queue needs ' + n + ' codes. Scan code 1 with your phone, then press → for the next one, or Cycle to show them in turn.';
    $('sheetnav').classList.add('show');
  } else {
    $('sheetsub').textContent = 'Point your phone’s camera at the code. Your playlist opens there, ready to play.';
  }
  renderXferFrame();
  if (h.oversize.length) {
    $('sheetwarn').textContent = h.oversize.length + (h.oversize.length > 1 ? ' tracks have links' : ' track has a link') + ' too long for a code. Copy link includes ' + (h.oversize.length > 1 ? 'them' : 'it') + '.';
    $('sheetwarn').hidden = false;
  }
}
function closeSheet() {
  if (!$('sheet').classList.contains('show')) return;
  stopCycle();
  $('sheet').classList.remove('show');
  $('sheetnav').classList.remove('show');
  xfer = null; sheetGen++;
  if (sheetResized) { try { resizeTo(sheetResized[0], sheetResized[1]); } catch (_) {} sheetResized = null; }
  const back = sheetReturn && document.contains(sheetReturn) ? sheetReturn : $('qphone');
  try { back.focus(); } catch (_) {}
}
const stepCode = d => { if (!xfer) return; stopCycle(); xfer.i = (xfer.i + d + xfer.links.length) % xfer.links.length; renderXferFrame(); };
$('qphone').onclick = openSheet;
$('sheetx').onclick = closeSheet;
$('sheetprev').onclick = () => stepCode(-1);
$('sheetnext').onclick = () => stepCode(1);
$('sheetauto').onclick = () => { if (!xfer) return; cycleT ? stopCycle() : startCycle(); };
$('sheetcopy').onclick = () => {
  if (!sheetLink) return;
  navigator.clipboard.writeText(sheetLink).then(() => qToast('Link copied. Open it on your phone.'), () => qToast('Couldn’t copy. The browser blocked the clipboard.'));
};
paintCycle();

/* ===== KEYBOARD ===== */
document.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable);
  const sheetOpen = $('sheet').classList.contains('show');
  if (e.key === 'Escape') {
    if (!menu.hidden) { closeMenu(true); return; }
    if (sheetOpen) { closeSheet(); return; }
    if (!typing && $('errbar').classList.contains('show')) hideBanner();
    return;
  }
  if (sheetOpen) {
    if (e.key === 'Tab') {                    // keep focus inside the dialog
      const f = sheetFocusables(); if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      return;
    }
    if (xfer && xfer.links.length > 1 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); stepCode(e.key === 'ArrowLeft' ? -1 : 1); }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !menu.hidden) return;
  if (e.code === 'Space') {
    // A control reached by keyboard keeps its own Space; otherwise Space is play/pause.
    if (tg !== $('pp') && tg instanceof Element && tg.matches('button,[role="button"],a') && tg.matches(':focus-visible')) return;
    e.preventDefault(); togglePlay(); return;
  }
  if (e.key === '/') { e.preventDefault(); toggleFilter(true); return; }
  if (e.code === 'ArrowLeft') { e.preventDefault(); seekBy(-5); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); seekBy(5); }
  else if (e.code === 'ArrowUp') { e.preventDefault(); setVol(vol + .05); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); setVol(vol - .05); }
});

/* ===== START =====
   Load the queue: extension first, localStorage if nothing answers. The opener
   starts posting the moment it opens this window, so tracks may already be
   here; keep the stored order, add those after it, and keep anything already
   playing anchored. If nothing is, put back the track and position that were
   current when the player last closed, paused. */
paintVol(); paintAll(); renderQ({ noSync: true }); toggleFilter(false);
extCall('ext-queue-get').then(r => {
  if (standingDown) return;                  // a relay never takes the stored queue
  let list;
  if (r && r.ok && Array.isArray(r.queue)) {
    extAlive = true; list = r.queue;
    try { console.info('[AFP player] queue from extension:', list.length, 'tracks'); } catch (_) {}
  } else {
    let s = null; try { s = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (_) {}
    list = s && Array.isArray(s.queue) ? s.queue : [];
    try { console.info('[AFP player] queue from local storage:', list.length, 'tracks'); } catch (_) {}
  }
  const early = queue.slice(), cur = idx >= 0 && queue[idx] ? queue[idx].url : null, seen = new Set();
  applyingRemote = true;
  try {
    queue.length = 0;
    list.forEach(t => { if (t && typeof t.url === 'string' && !seen.has(t.url)) { seen.add(t.url); queue.push(normTrack(Object.assign({}, t))); } });
    early.forEach(t => { if (!seen.has(t.url)) { seen.add(t.url); queue.push(t); } });
    idx = cur ? queue.findIndex(t => t.url === cur) : -1;
  } finally { applyingRemote = false; }
  loaded = true;                             // only now is our picture complete enough to broadcast
  if (idx < 0) {
    let now = null; try { now = JSON.parse(localStorage.getItem(NOW_KEY) || 'null'); } catch (_) {}
    const i = now && typeof now.url === 'string' ? queue.findIndex(t => t.url === now.url) : -1;
    if (i >= 0) loadIdx(i, { play: false, at: +now.pos || 0 });
  }
  renderQ();
  paintAll();
});
</script></body></html>
